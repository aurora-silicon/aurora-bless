[package]
name = "aurora-btsync"
license = "MIT"
version = "0.3.0"
edition = "2021"
description = "Sync Bluetooth pairing keys shared with macOS from NVRAM on Apple silicon Macs"
homepage = "https://github.com/aurora-silicon/aurora-bless"
repository = "https://github.com/aurora-silicon/aurora-bless"

[dependencies]
dbus = "0.9.7"

[dependencies.apple-nvram]
path = "../apple-nvram"
version = "0.4"

[dependencies.clap]
version = "4.5"
features = ["cargo"]
